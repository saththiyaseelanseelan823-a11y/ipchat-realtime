<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPCHAT — Real-time rooms</title><style>
:root{font-family:Consolas,'Courier New',monospace;color:#e5efff;background:#090f1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 40% 70%,#1c355b 0,#0d1525 50%,#070b13 100%);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.logo{font-size:clamp(25px,4vw,38px);font-weight:900;letter-spacing:3px;color:#e8f3ff}.logo span{color:#00ddff;text-shadow:0 0 18px #00bfffa0}.join{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(520px,100%);padding:48px 42px;background:linear-gradient(145deg,#17243bde,#192b4fd9);border:1px solid #38516e;border-radius:16px;box-shadow:0 22px 90px #0009,0 0 50px #1478e520}.subtitle{color:#a8b8d4;margin:16px 0 38px;font-size:14px}label{display:block;color:#a8bddb;font-size:12px;font-weight:bold;letter-spacing:2px;margin:18px 0 10px}input{background:#15263f;color:#fff;border:1px solid #4a6587;border-radius:11px;padding:16px;width:100%;outline:none}input:focus{border-color:#00dfff;box-shadow:0 0 0 2px #00dfff33,0 0 20px #00bfff44}.hint{font-size:11px;color:#8fa5c4;line-height:1.6}.connect{background:#00dcf6;border:0;color:#052039;width:100%;padding:17px;border-radius:10px;margin-top:22px;font-weight:900;letter-spacing:3px;box-shadow:0 0 24px #00ddff55}.error{color:#ff7f98;min-height:20px;font-size:12px}.chat{display:none;height:100vh;flex-direction:column}.top{height:80px;flex-shrink:0;border-bottom:1px solid #26344d;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px;background:#090e18}.top .logo{font-size:27px}.roomtitle{color:#8999b5;font-size:13px;letter-spacing:2px}.roomtitle b{color:#00dfff;font-size:19px}.topright{display:flex;align-items:center;gap:15px}.danger{border:1px solid #a84562;background:transparent;color:#ff718e;border-radius:10px;padding:10px 15px}.leave{border:1px solid #3b5774;background:#14243c;color:#c7dbf5;border-radius:10px;padding:10px 15px}.layout{display:flex;min-height:0;flex:1}.sidebar{width:265px;flex-shrink:0;border-right:1px solid #283951;background:#101b2d;padding:22px 16px}.sidebox{background:#18263c;border:1px solid #293e58;border-radius:9px;padding:18px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:#899bb7}.code{color:#00ddff;font-weight:900;font-size:22px;margin:9px 0}.online{font-size:13px;color:#c7d8eb}.dot{display:inline-block;width:9px;height:9px;background:#43edb5;border-radius:50%;box-shadow:0 0 10px #43edb5;margin-right:8px}.member{padding:13px 10px;margin-top:9px;background:#1a2b45;border:1px solid #2b3f59;border-radius:8px;font-size:13px;color:#dbe8f9}.member.me{color:#00ddff}.main{flex:1;min-width:0;display:flex;flex-direction:column}.messages{flex:1;overflow-y:auto;padding:35px;display:flex;flex-direction:column;gap:18px}.message{max-width:min(70%,550px);align-self:flex-start}.message.own{align-self:flex-end}.meta{font-size:11px;color:#96a8c4;margin:0 5px 7px}.meta strong{color:#00ddff}.message.own .meta{text-align:right}.message.own .meta strong{color:#a99bff}.bubble{display:inline-block;background:#283752;border-radius:13px 13px 13px 3px;padding:15px 18px;line-height:1.5;overflow-wrap:anywhere}.own .bubble{background:#7165df;border-radius:13px 13px 3px 13px}.typing{min-height:23px;padding:0 35px;color:#69d4e9;font-size:12px}.composer{border-top:1px solid #27364d;padding:18px 26px;display:flex;gap:12px;background:#10192a}.composer input{flex:1}.composer button{border:0;border-radius:9px;padding:0 24px;background:#00dcf6;color:#092036;font-weight:900}.empty{margin:auto;color:#647e9e;text-align:center;font-size:14px}@media(max-width:680px){.top{padding:12px;height:auto;flex-wrap:wrap}.top .logo{font-size:22px}.roomtitle{order:3;width:100%}.sidebar{width:125px;padding:10px 7px}.sidebox{padding:10px}.member{font-size:11px;overflow-wrap:anywhere}.messages{padding:15px}.message{max-width:90%}.composer{padding:10px}.composer button{padding:0 12px}.panel{padding:35px 24px}}
</style></head><body><section class="join" id="join"><div class="panel"><div class="logo">[IP<span>CHAT</span>]</div><p class="subtitle">Enter a shared room code to join the same room</p><label for="name">USERNAME</label><input id="name" maxlength="24" placeholder="Your name" autocomplete="nickname"><label for="room">IP ADDRESS (ROOM CODE)</label><input id="room" maxlength="32" placeholder="1234" autocomplete="off"><p class="hint">Anyone who enters the same room code can share this room.</p><p class="error" id="error"></p><button class="connect" id="connect">CONNECT →</button></div></section><section class="chat" id="chat"><header class="top"><div class="logo">[IP<span>CHAT</span>]</div><div class="roomtitle">ROOM // <b id="roomlabel"></b></div><div class="topright"><button class="danger" id="clear">♧ Clear</button><button class="leave" id="leave">Leave</button></div></header><div class="layout"><aside class="sidebar"><div class="sidebox"><div class="eyebrow">ROOM</div><div class="code" id="sidecode"></div><div class="online"><span class="dot"></span><span id="count">0</span> online</div></div><div class="eyebrow">MEMBERS</div><div id="members"></div></aside><main class="main"><div class="messages" id="messages"><div class="empty" id="empty">No messages yet. Start the conversation.</div></div><div class="typing" id="typing"></div><form class="composer" id="form"><input id="message" maxlength="2000" placeholder="Type a message..." autocomplete="off"><button type="submit">SEND ➤</button></form></main></div></section><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);const socket=io({autoConnect:false});let myName='',room='',typingTimer;function showChat(){ $('join').style.display='none';$('chat').style.display='flex';$('roomlabel').textContent=room;$('sidecode').textContent=room;$('message').focus() }function join(){const name=$('name').value.trim(),code=$('room').value.trim();if(!name||!code){$('error').textContent='Enter your username and room code.';return}myName=name;room=code;socket.connect();socket.emit('join',{name,room:code},res=>{if(res?.ok){$('error').textContent='';showChat()}else $('error').textContent=res?.error||'Could not join room.'})} $('connect').onclick=join;$('room').addEventListener('keydown',e=>{if(e.key==='Enter')join()});socket.on('members',list=>{$('count').textContent=list.length;$('members').replaceChildren();list.forEach(m=>{const el=document.createElement('div');el.className='member'+(m.id===socket.id?' me':'');el.textContent='🟢 '+m.name+(m.id===socket.id?' (you)':'');$('members').append(el)})});socket.on('message',m=>{ $('empty')?.remove();const wrap=document.createElement('div');wrap.className='message'+(m.id===socket.id?' own':'');const meta=document.createElement('div');meta.className='meta';const strong=document.createElement('strong');strong.textContent=m.name;const time=document.createElement('span');time.textContent='  '+new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(strong,time);const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;wrap.append(meta,bubble);$('messages').append(wrap);$('messages').scrollTop=$('messages').scrollHeight});$('form').onsubmit=e=>{e.preventDefault();const msg=$('message').value.trim();if(msg){socket.emit('message',msg);$('message').value='';socket.emit('typing',false)}};$('message').addEventListener('input',()=>{socket.emit('typing',true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('typing',false),900)});const typing=new Map();socket.on('typing',data=>{if(data.typing)typing.set(data.id,data.name);else typing.delete(data.id);$('typing').textContent=[...typing.values()].join(', ')+(typing.size?' typing...':'')});$('clear').onclick=()=>{if(confirm('Clear messages from your view?')){$('messages').replaceChildren();const el=document.createElement('div');el.id='empty';el.className='empty';el.textContent='Messages cleared from this view.';$('messages').append(el)}};$('leave').onclick=()=>location.reload();
</script></body></html>
